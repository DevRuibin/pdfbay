<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Primary Meta Tags -->
    <title>Contact PDFBay — Support and Feedback</title>
    <meta
      name="description"
      content="Get in touch about a bug, a missing tool or a question about privacy. Send feedback and we will read it — no account required."
    />
    <meta name="author" content="PDFBay" />
    <meta name="robots" content="index, follow" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://pdfbay.projectbay.uk/contact" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pdfbay.projectbay.uk/contact" />
    <meta property="og:title" content="Contact PDFBay — Support and Feedback" />
    <meta
      property="og:description"
      content="Get in touch about a bug, a missing tool or a question about privacy. Send feedback and we will read it — no account required."
    />

    <meta
      property="og:image"
      content="https://pdfbay.projectbay.uk/images/og-home.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta
      property="og:image:alt"
      content="PDFBay — free, private PDF tools that run in your browser"
    />
    <meta property="og:site_name" content="PDFBay" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="https://pdfbay.projectbay.uk/images/og-home.png"
    />
    <meta
      name="twitter:image:alt"
      content="PDFBay — free, private PDF tools that run in your browser"
    />
    <meta
      name="twitter:title"
      content="Contact PDFBay — Support and Feedback"
    />
    <meta
      name="twitter:description"
      content="Get in touch about a bug, a missing tool or a question about privacy. Send feedback and we will read it — no account required."
    />

    <link href="/src/css/styles.css" rel="stylesheet" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/images/favicon-192x192.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/images/favicon-512x512.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/images/apple-touch-icon.png"
    />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
  </head>

  <body class="antialiased bg-gray-900 text-gray-300">
    {{> navbar }}

    <div id="app" class="min-h-screen container mx-auto p-4 md:p-8">
      <section id="contact-hero" class="text-center py-16 md:py-24">
        <h1
          class="text-4xl md:text-5xl font-bold text-white mb-4"
          data-i18n="contact.title"
        >
          Get in Touch
        </h1>
        <p
          class="text-lg md:text-xl text-gray-400 max-w-3xl mx-auto"
          data-i18n="contact.subtitle"
        >
          We'd love to hear from you. Whether you have a question, feedback, or
          a feature request, please don't hesitate to reach out.
        </p>
      </section>

      <div class="max-w-2xl mx-auto text-center py-8">
        <p class="text-lg text-gray-400">
          <span data-i18n="contact.email"
            >Found a bug or have a feature request?</span
          >
          <a
            href="https://github.com/DevRuibin/pdfbay/issues"
            class="text-violet-300 underline hover:text-violet-200"
            >open an issue on GitHub</a
          >
        </p>
      </div>
    </div>

    {{> footer }}

    <script type="module" src="src/js/utils/lucide-init.ts"></script>
    <script type="module" src="src/js/main.ts"></script>
    <script type="module" src="src/js/mobileMenu.ts"></script>
    <!-- JSON-LD Schema -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ContactPage",
        "name": "Contact PDFBay - Get in Touch | Support",
        "url": "https://pdfbay.projectbay.uk/contact"
      }
    </script>
  </body>
</html>
