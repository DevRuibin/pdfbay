      <a href="about.html" class="mobile-nav-link" data-i18n="nav.about"
        >About</a

      <a href="faq.html" class="mobile-nav-link" data-i18n="nav.faq">FAQ</a>
      <a
        href="https://github.com/DevRuibin/pdfbay/"
        target="_blank"
        rel="noopener noreferrer"
        class="mobile-nav-link"
        data-i18n="nav.github"
